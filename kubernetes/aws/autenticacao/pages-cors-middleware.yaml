apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: autenticacao-pages-cors
  namespace: ecociente
spec:
  headers:
    accessControlAllowOriginList:
      - https://ecociente-instituto-j-f.github.io
    accessControlAllowMethods:
      - OPTIONS
      - POST
    accessControlAllowHeaders:
      - Content-Type
      - Accept
    accessControlMaxAge: 3600
    addVaryHeader: true
