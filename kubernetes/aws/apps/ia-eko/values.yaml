replicaCount: 1

fullnameOverride: ia-eko

image:
  repository: ecociente/ecociente
  tag: ia-eko-1.0.1
  pullPolicy: IfNotPresent

containerPort: 8000

configMap:
  enabled: true
  nameOverride: ia-eko-config
  data:
    APP_NAME: "EcoCiente Eko Chatbot"
    APP_VERSION: "1.9.0"
    APP_ENV: "development"

    HOST: "0.0.0.0"
    PORT: "8000"
    LOG_LEVEL: "INFO"

    LLM_PROVIDER: "mock"
    EMBEDDING_PROVIDER: "mock"

    KNOWLEDGE_BASE_PATH: "data/FAQ_KNOWLEDGE_BASE.md"

    ENABLE_EXTERNAL_SOURCE: "false"

    STORAGE_MODE: "memory"
    ALLOW_STORAGE_FALLBACK: "true"

    SESSION_TTL_SECONDS: "1800"
    MEMORY_MAX_MESSAGES: "20"
    MEMORY_KEEP_RECENT_MESSAGES: "6"

    JUDGE_MAX_CORRECTIONS: "1"

    POSTGRES_POOL_MIN: "1"
    POSTGRES_POOL_MAX: "2"
    POSTGRES_CONNECT_TIMEOUT: "3"

    RUN_INTEGRATION_TESTS: "false"
    RUN_CALENDAR_INTEGRATION_TESTS: "false"

    ALLOW_TEST_IDENTITY_HEADERS: "false"

secret:
  existingSecret: ia-eko-secret

service:
  enabled: true
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: traefik
  host: "api.52.71.117.143.sslip.io"
  path: /api/v1
  pathType: Prefix
  annotations: {}

  tls:
    enabled: true
    secretName: ecociente-api-tls

probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 24

  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3

  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 3
    failureThreshold: 3

resources:
  requests:
    cpu: 250m
    memory: 512Mi

  limits:
    cpu: "1"
    memory: 1Gi

podLabels: {}