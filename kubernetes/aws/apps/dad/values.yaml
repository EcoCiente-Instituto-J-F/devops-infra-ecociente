replicaCount: 1

fullnameOverride: dad-api

image:
  repository: ecociente/ecociente
  tag: dad-1.0.1
  pullPolicy: IfNotPresent

containerPort: 8080

configMap:
  enabled: true
  nameOverride: dad-config
  data:
    CORS_ORIGINS: "https://ecociente-instituto-j-f.github.io,http://localhost:5173"

secret:
  existingSecret: dad-secret

service:
  enabled: true
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: traefik
  host: "api.52.71.117.143.sslip.io"
  path: /api/admin/v1
  pathType: Prefix
  annotations: {}

  tls:
    enabled: true
    secretName: ecociente-api-tls

probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

podLabels: {}
