replicaCount: 1

fullnameOverride: autenticacao-api

image:
  repository: ecociente/ecociente
  tag: autenticacao-1.0.2
  pullPolicy: IfNotPresent

containerPort: 9801

configMap:
  enabled: true
  nameOverride: autenticacao-config

  data:
    JWT_EXPIRATION_MS: "300000"

secret:
  existingSecret: autenticacao-neon-secret

service:
  enabled: true
  type: ClusterIP
  port: 9801

ingress:
  enabled: true
  className: traefik
  host: "api.52.71.117.143.sslip.io"
  path: /auth
  pathType: Prefix
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ecociente-autenticacao-pages-cors@kubernetescrd

  tls:
    enabled: true
    secretName: ecociente-api-tls

probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

corsMiddleware:
  enabled: true
  name: autenticacao-pages-cors
  allowOrigins:
    - https://ecociente-instituto-j-f.github.io
  allowMethods:
    - OPTIONS
    - POST
  allowHeaders:
    - Content-Type
    - Accept
  maxAge: 3600
