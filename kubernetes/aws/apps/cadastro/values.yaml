replicaCount: 1

fullnameOverride: cadastro-api

image:
  repository: ecociente/ecociente
  tag: cadastro-1.0.0
  pullPolicy: IfNotPresent

containerPort: 9090

configMap:
  enabled: true
  nameOverride: cadastro-config
  data:
    SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "3"
    SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "1"
    SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: "10000"
    SPRING_DATASOURCE_HIKARI_IDLETIMEOUT: "60000"
    SPRING_DATASOURCE_HIKARI_MAXLIFETIME: "600000"

secret:
  existingSecret: cadastro-secret

service:
  enabled: true
  type: ClusterIP
  port: 9090

ingress:
  enabled: true
  className: traefik
  host: "api.52.71.117.143.sslip.io"
  path: /api/cadastro
  pathType: Prefix
  annotations: {}

  tls:
    enabled: true
    secretName: ecociente-api-tls

probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

podLabels: {}