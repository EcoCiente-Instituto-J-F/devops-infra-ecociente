replicaCount: 1

fullnameOverride: mobile-api

image:
  repository: ecociente/ecociente
  tag: mobile-1.1.5
  pullPolicy: IfNotPresent

containerPort: 8080

configMap:
  enabled: true
  nameOverride: mobile-config
  data:
    SERVER_PORT: "8080"
    APP_JOBS_ENABLED: "false"
    APP_PUSH_ENABLED: "false"
    VALIDADOR_ATIVO: "false"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "validate"
    SPRING_SQL_INIT_MODE: "never"
    SPRING_FLYWAY_ENABLED: "false"
    SPRING_LIQUIBASE_ENABLED: "false"

secret:
  # Secret existente no cluster; nunca armazenar seus valores no Git.
  existingSecret: mobile-neon-secret

service:
  enabled: true
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: traefik
  host: ""
  path: /
  pathType: Prefix
  annotations: {}

  tls:
    enabled: false
    secretName: ""

probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 90

  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 384Mi

  limits:
    cpu: 800m
    memory: 1Gi

podLabels: {}
