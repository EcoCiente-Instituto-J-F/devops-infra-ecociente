replicaCount: 1

fullnameOverride: mobile-api

image:
  repository: ecociente/ecociente
  tag: mobile-1.0.0
  pullPolicy: IfNotPresent

containerPort: 8080

configMap:
  enabled: true
  nameOverride: mobile-config
  data:
    SERVER_PORT: "8080"
    SPRING_DATASOURCE_HIKARI_MAXIMUMPOOLSIZE: "3"
    SPRING_DATASOURCE_HIKARI_MINIMUMIDLE: "1"
    SPRING_DATASOURCE_HIKARI_CONNECTIONTIMEOUT: "10000"

secret:
  # Provisionar no Kubernetes antes do merge; nao versionar os valores.
  # Chaves: DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET.
  existingSecret: mobile-secret

service:
  enabled: true
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: traefik
  host: ""
  path: /
  pathType: Prefix
  annotations: {}

  tls:
    enabled: false
    secretName: ""

probes:
  startup:
    enabled: true
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 30

  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

  liveness:
    enabled: true
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 100m
    memory: 256Mi

  limits:
    cpu: 500m
    memory: 512Mi

podLabels: {}
